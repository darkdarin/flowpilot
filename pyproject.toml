[project]
name = "flowpilot-workspace"
version = "0.0.0"
description = "FlowPilot monorepo workspace root (not published)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pavel Babushkin", email = "idarksoft@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flowpilot-sdk",
    "flowpilot-core",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
flowpilot-sdk = { workspace = true }
flowpilot-core = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "BLE"]

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["flowpilot_sdk", "flowpilot_core"]
