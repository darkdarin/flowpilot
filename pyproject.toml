[project]
name = "flowpilot-workspace"
version = "0.0.0"
description = "FlowPilot monorepo workspace root (not published)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pavel Babushkin", email = "idarksoft@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flowpilot-sdk",
    "flowpilot-core",
    "flowpilot-server",
    "flowpilot-wyoming",
    "flowpilot-vad",
    "flowpilot-audio",
    "flowpilot-soniox",
    "flowpilot-deepgram",
    "flowpilot-llm",
    "flowpilot-speech",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]
# The HA integration has its own environment (Home Assistant + its test harness).
exclude = ["ha-integration"]

[tool.uv.sources]
flowpilot-sdk = { workspace = true }
flowpilot-core = { workspace = true }
flowpilot-server = { workspace = true }
flowpilot-wyoming = { workspace = true }
flowpilot-vad = { workspace = true }
flowpilot-audio = { workspace = true }
flowpilot-soniox = { workspace = true }
flowpilot-deepgram = { workspace = true }
flowpilot-llm = { workspace = true }
flowpilot-speech = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "types-jsonschema>=4.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "plugins"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["flowpilot_sdk", "flowpilot_core", "flowpilot_server", "flowpilot_wyoming", "flowpilot_vad", "flowpilot_audio", "flowpilot_soniox", "flowpilot_deepgram", "flowpilot_llm", "flowpilot_speech", "custom_components"]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
    "packages/flowpilot-sdk/src",
    "packages/flowpilot-sdk/tests",
    "packages/flowpilot-core/src",
    "packages/flowpilot-core/tests",
    "packages/flowpilot-server/src",
    "packages/flowpilot-server/tests",
    "plugins/flowpilot-wyoming/src",
    "plugins/flowpilot-wyoming/wyoming_tests",
    "plugins/flowpilot-vad/src",
    "plugins/flowpilot-vad/vad_tests",
    "plugins/flowpilot-audio/src",
    "plugins/flowpilot-audio/audio_tests",
    "plugins/flowpilot-soniox/src",
    "plugins/flowpilot-soniox/soniox_tests",
    "plugins/flowpilot-deepgram/src",
    "plugins/flowpilot-deepgram/deepgram_tests",
    "plugins/flowpilot-llm/src",
    "plugins/flowpilot-llm/llm_tests",
    "plugins/flowpilot-speech/src",
    "plugins/flowpilot-speech/speech_tests",
]

[[tool.mypy.overrides]]
module = ["pymicro_vad"]
ignore_missing_imports = true
