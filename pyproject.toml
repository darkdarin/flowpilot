[project]
name = "flowpilot-workspace"
version = "0.0.0"
description = "FlowPilot monorepo workspace root (not published)"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pavel Babushkin", email = "idarksoft@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flowpilot-sdk",
    "flowpilot-core",
    "flowpilot-server",
    "flowpilot-wyoming",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "plugins/*"]

[tool.uv.sources]
flowpilot-sdk = { workspace = true }
flowpilot-core = { workspace = true }
flowpilot-server = { workspace = true }
flowpilot-wyoming = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
    "types-jsonschema>=4.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "plugins"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["flowpilot_sdk", "flowpilot_core", "flowpilot_server", "flowpilot_wyoming"]

[tool.mypy]
python_version = "3.14"
strict = true
files = [
    "packages/flowpilot-sdk/src",
    "packages/flowpilot-sdk/tests",
    "packages/flowpilot-core/src",
    "packages/flowpilot-core/tests",
    "packages/flowpilot-server/src",
    "packages/flowpilot-server/tests",
    "plugins/flowpilot-wyoming/src",
    "plugins/flowpilot-wyoming/wyoming_tests",
]
