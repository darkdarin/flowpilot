[project]
name = "flowpilot-core"
version = "0.1.25"
description = "FlowPilot runtime: graph validation and execution"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pavel Babushkin", email = "idarksoft@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flowpilot-sdk",
    "jsonschema>=4.23",
]

[tool.uv.sources]
flowpilot-sdk = { workspace = true }

[project.urls]
Repository = "https://github.com/darkdarin/flowpilot"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
