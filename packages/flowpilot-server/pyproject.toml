[project]
name = "flowpilot-server"
version = "0.1.16"
description = "FlowPilot runtime server: WebSocket protocol for clients such as the Home Assistant integration"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pavel Babushkin", email = "idarksoft@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.11",
    "flowpilot-core",
    "flowpilot-sdk",
]

[project.scripts]
flowpilot-server = "flowpilot_server.__main__:main"

[tool.uv.sources]
flowpilot-sdk = { workspace = true }
flowpilot-core = { workspace = true }

[project.urls]
Repository = "https://github.com/darkdarin/flowpilot"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
