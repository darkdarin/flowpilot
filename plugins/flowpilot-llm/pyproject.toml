[project]
name = "flowpilot-llm"
version = "0.1.11"
description = "FlowPilot LLM agent: any OpenAI-compatible chat API, streamed"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pavel Babushkin", email = "idarksoft@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flowpilot-sdk",
    "aiohttp>=3.10",
]

[project.entry-points."flowpilot.nodes"]
llm = "flowpilot_llm:nodes"

[tool.uv.sources]
flowpilot-sdk = { workspace = true }

[project.urls]
Repository = "https://github.com/darkdarin/flowpilot"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
