[project]
name = "flowpilot-wyoming"
version = "0.1.35"
description = "FlowPilot nodes for any Wyoming speech-to-text and text-to-speech service"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pavel Babushkin", email = "idarksoft@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flowpilot-sdk",
    # Same version as the Home Assistant Wyoming integration.
    "wyoming==1.10.2",
]

[project.entry-points."flowpilot.nodes"]
wyoming = "flowpilot_wyoming:nodes"

[tool.uv.sources]
flowpilot-sdk = { workspace = true }

[project.urls]
Repository = "https://github.com/darkdarin/flowpilot"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
