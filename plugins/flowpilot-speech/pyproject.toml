[project]
name = "flowpilot-speech"
version = "0.1.37"
description = "FlowPilot text for speech: English words, acronyms, numbers and units spelled for a Russian voice"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Pavel Babushkin", email = "idarksoft@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flowpilot-sdk",
    "cmudict>=1.1.3",
    "num2words>=0.5.14",
    "pymorphy3>=2.0.6",
    "pymorphy3-dicts-ru>=2.4.417150.4580142",
]

[project.entry-points."flowpilot.nodes"]
speech = "flowpilot_speech:nodes"

[tool.uv.sources]
flowpilot-sdk = { workspace = true }

[project.urls]
Repository = "https://github.com/darkdarin/flowpilot"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
