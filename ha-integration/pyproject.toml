[project]
name = "flowpilot-ha-integration-dev"
version = "0.0.0"
description = "Development environment for the FlowPilot Home Assistant integration (not published)"
requires-python = ">=3.14.2"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    # Pinned to one Home Assistant release: 0.13.375 == homeassistant 2026.10.4.
    "pytest-homeassistant-custom-component==0.13.375",
    # Requirements of the components the tests set up (from their 2026.10.4 manifests).
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.6",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "mutagen==1.48.1",
    "ha-ffmpeg==3.2.2",
    "flowpilot-server",
    "flowpilot-core",
    "flowpilot-sdk",
    "mypy>=1.18",
]

[tool.uv.sources]
flowpilot-server = { path = "../packages/flowpilot-server", editable = true }
flowpilot-core = { path = "../packages/flowpilot-core", editable = true }
flowpilot-sdk = { path = "../packages/flowpilot-sdk", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", ".."]  # ".." holds custom_components/

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
files = ["../custom_components/flowpilot", "tests"]
mypy_path = ".."

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
follow_untyped_imports = true
