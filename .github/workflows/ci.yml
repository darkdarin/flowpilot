name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q

  # The companion integration inside a real Home Assistant (test harness pinned to one HA release).
  # test_voice_turn_is_one_flowpilot_turn is the regression test for ADR-012.
  ha-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-integration
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install ffmpeg (checked when the tts component sets up)
        timeout-minutes: 5  # the apt mirror has hung for a quarter of an hour before
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: uv sync --locked
      - name: Type check against Home Assistant
        run: uv run mypy
      - name: Tests
        run: uv run pytest -q -p no:logging

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check and build
        run: npm run build

  # The runtime image for both platforms of the Home Assistant add-on (built, not published).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build amd64 and arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint the add-on configuration
        uses: frenck/action-addon-linter@v2
        with:
          path: ./addon
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Assemble the local add-on folder
        run: uv run --no-project python -I scripts/build_addon.py

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
