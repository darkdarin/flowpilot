# Home Assistant add-on: the FlowPilot runtime with its graph editor in the sidebar (Ingress).
# The image is the repository's Dockerfile, published to ghcr for each release (release.yml);
# scripts/build_addon.py makes a local add-on that Home Assistant builds from source instead.
name: FlowPilot
version: "0.1.38"
slug: flowpilot
description: Visual orchestrator for voice and AI flows
url: https://github.com/darkdarin/flowpilot
image: ghcr.io/darkdarin/flowpilot
arch:
  - aarch64
  - amd64
homeassistant: "2026.10.0"
init: false
startup: services
ingress: true
panel_icon: mdi:graph-outline
panel_title: FlowPilot
discovery:
  - flowpilot
# Live debug's recordings (what nodes passed on; the Debug probe's before 0.1.34) are voices of the
# household: keep them out of backups (debug.record: where releases up to 0.1.2 kept them).
backup_exclude:
  - nodes/debug.probe/*
  - nodes/debug.record/*
  # voice models: downloaded again on demand (the voice profiles themselves are backed up)
  - models/*
ports:
  8765/tcp: null
ports_description:
  8765/tcp: Runtime API for clients outside Home Assistant (the integration does not need it)
options:
  log_level: info
  dev_nodes: false
schema:
  log_level: list(debug|info|warning|error)
  dev_nodes: bool
