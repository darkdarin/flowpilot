# Home Assistant add-on: the FlowPilot runtime with its graph editor in the sidebar (Ingress).
# The image is built from the repository's Dockerfile; see scripts/build_addon.py.
name: FlowPilot
version: "0.1.0"
slug: flowpilot
description: Visual orchestrator for voice and AI flows
url: https://github.com/darkdarin/flowpilot
arch:
  - aarch64
  - amd64
homeassistant: "2026.10.0"
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:graph-outline
panel_title: FlowPilot
discovery:
  - flowpilot
ports:
  8765/tcp: null
ports_description:
  8765/tcp: Runtime API for clients outside Home Assistant (the integration does not need it)
options:
  log_level: info
  dev_nodes: false
schema:
  log_level: list(debug|info|warning|error)
  dev_nodes: bool
